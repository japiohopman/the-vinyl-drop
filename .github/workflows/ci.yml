name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rate_limit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rate_limit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RATE_LIMIT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rate_limit_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run linter
        run: npm run lint

      - name: Run type checker
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Verify database migrations
        run: npm run db:verify

      - name: Build project
        run: npm run build
