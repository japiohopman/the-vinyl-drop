name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    # Keep the runner stable and use the exact Playwright 1.63.0 browser/dependency image.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute
      options: --ipc=host
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rate_limit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rate_limit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RATE_LIMIT_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/rate_limit_test
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Browsers and native dependencies are preinstalled in the matching Playwright 1.63.0 container.

      - name: Run linter
        run: npm run lint

      - name: Run type checker
        run: npm run typecheck

      - name: Run unit & integration tests
        timeout-minutes: 10
        env:
          ERROR_PAGE_EVIDENCE_DIR: artifacts/issue-315
        run: npm test

      - name: Upload Issue #315 error-page browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-315-error-pages-playwright-evidence
          path: artifacts/issue-315/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify catalogue search performance and browser accessibility
        run: npm run test:catalogue-search

      - name: Verify database migrations
        run: npm run db:verify

      - name: Build project
        run: npm run build

      - name: Capture Issue #292 responsive browser evidence
        env:
          UI_EVIDENCE_DIR: artifacts/issue-292
        run: npm run test:ui-evidence

      - name: Upload Issue #292 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-292-playwright-evidence
          path: artifacts/issue-292/
          if-no-files-found: warn
          retention-days: 14

      - name: Capture Issue #293 desktop Browse evidence
        env:
          BROWSE_EVIDENCE_DIR: artifacts/issue-293
        run: npm run test:browse-evidence

      - name: Upload Issue #293 desktop Browse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-293-browse-playwright-evidence
          path: artifacts/issue-293/
          if-no-files-found: warn
          retention-days: 14

      - name: Capture Issue #300 Options browser evidence
        env:
          OPTIONS_EVIDENCE_DIR: artifacts/issue-300
        run: npx jest test/optionsPage.test.ts --runInBand --testNamePattern="changes the whole page immediately"

      - name: Upload Issue #300 Options browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-300-options-playwright-evidence
          path: artifacts/issue-300/
          if-no-files-found: warn
          retention-days: 14

  production-preflight-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test production migration preflight on Linux
        shell: pwsh
        run: ./test/production-preflight.Tests.ps1

  production-preflight-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test production migration preflight on Windows
        shell: pwsh
        run: ./test/production-preflight.Tests.ps1
