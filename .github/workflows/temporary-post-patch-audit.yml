name: Temporary post-patch npm audit

on:
  push:
    branches:
      - audit/issue-363-post-patch-npm-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audited lockfile
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Run npm audit and verify targeted packages
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-post-patch.json
          audit_exit=$?
          set -e
          echo "npm audit exit code: $audit_exit (non-zero is expected while unrelated findings remain)"
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-post-patch.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (!counts) {
            console.error('Audit report is missing vulnerability metadata.');
            process.exit(2);
          }
          console.log('POST-PATCH AUDIT TOTALS');
          console.log(JSON.stringify(counts, null, 2));
          console.log('REMAINING PACKAGE FINDINGS');
          for (const [name, finding] of Object.entries(report.vulnerabilities || {})) {
            console.log(`${finding.severity.toUpperCase()} ${name} | direct=${finding.isDirect} | range=${finding.range}`);
          }
          const targeted = ['body-parser', 'qs', 'handlebars'];
          const stillAffected = targeted.filter(name => report.vulnerabilities?.[name]);
          if (stillAffected.length) {
            console.error('Targeted package findings remain:', stillAffected.join(', '));
            process.exit(1);
          }
          console.log('PASS: body-parser, qs and handlebars no longer appear in npm audit findings.');
          NODE

      - name: Upload full post-patch npm audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvd-post-patch-npm-audit
          path: npm-audit-post-patch.json
          if-no-files-found: error
          retention-days: 3
