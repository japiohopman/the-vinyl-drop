name: Jules Issue Dispatcher & Preflight

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (set to false for live Jules API dispatch)'
        type: boolean
        required: true
        default: true
      issue_number:
        description: 'Optional target issue number (leave empty for auto selection)'
        type: string
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  dispatch-preflight:
    name: Issue Selector and Preflight Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile authoritative workflow dispatcher module
        run: npx tsc src/workflow/julesDispatcher.ts --outDir dist/workflow --module commonjs --target es2022 --skipLibCheck

      - name: Run Authoritative Jules Dispatcher
        uses: actions/github-script@v7
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { runJulesDispatcher } = require('./dist/workflow/julesDispatcher.js');

            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const targetIssueNum = '${{ inputs.issue_number }}'.trim();
            const dryRun = '${{ inputs.dry_run }}' !== 'false';
            const julesApiKey = process.env.JULES_API_KEY || '';
            const token = process.env.GITHUB_TOKEN || '';

            const result = await runJulesDispatcher({
              repository,
              token,
              julesApiKey,
              issueNumber: targetIssueNum ? parseInt(targetIssueNum, 10) : undefined,
              dryRun,
            });

            if (!result.success) {
              core.setFailed('Preflight failed:\n' + result.errors.map((e) => '  - ' + e).join('\n'));
              return;
            }

            core.info(`✅ Selected Issue #${result.issueNumber}: "${result.issueTitle}"`);
            core.info(`Primary Specialist: ${result.selectedIssue?.primarySpecialist || 'N/A'}`);
            core.info(`Secondary Specialist: ${result.selectedIssue?.secondarySpecialist || 'N/A'}`);

            if (result.dryRun) {
              core.info('\n[DRY RUN SUMMARY] Preflight completed successfully without calling Jules API.');
              core.info('Official Jules Session Payload:\n' + JSON.stringify(result.dispatchPayload, null, 2));
            } else {
              core.info('\n[LIVE DISPATCH] Live Jules session created successfully!');
            }
