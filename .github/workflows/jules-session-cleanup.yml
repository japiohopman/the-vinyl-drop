name: Jules Session Cleanup

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Session ID to clean up'
        required: true

jobs:
  cleanup-session:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stale Session Cleanup Script
        env:
          SESSION_ID: ${{ github.event.inputs.session_id }}
        run: npx tsx scripts/stale-session-cleanup.ts
