name: Manual Jules Stale-Session Cleanup

on:
  workflow_dispatch:
    inputs:
      session_ids:
        description: 'Comma or newline-separated list of session IDs/names to inspect (e.g. 12345 or sessions/12345)'
        type: string
        required: true
      confirmation_token:
        description: 'Confirmation token to authorise session deletion (must be DELETE_STALE_SESSIONS)'
        type: string
        required: false
      dry_run:
        description: 'Inspection-only dry-run mode (set false for live deletion)'
        type: boolean
        required: true
        default: true

concurrency:
  group: jules-cleanup-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup-stale-sessions:
    name: Inspect and Clean Named Stale Jules Sessions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted base repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Manual Stale Session Cleanup Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          SESSION_IDS: ${{ inputs.session_ids }}
          CONFIRMATION_TOKEN: ${{ inputs.confirmation_token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npx tsx scripts/julesSessionCleanup.ts
