name: ChatGPT Review Relay

on:
  pull_request_target:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
      - closed
    branches:
      - main

concurrency:
  group: chatgpt-review-relay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  chatgpt-review-relay:
    name: ChatGPT Review Relay Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted base repository code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Authoritative ChatGPT Review Relay Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: npx tsx scripts/chatgptReviewRelay.ts
